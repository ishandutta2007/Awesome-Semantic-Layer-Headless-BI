<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Animated Ambient Glow 1 -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.25;0.4;0.25" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Ambient Glow 2 -->
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.22;0.38;0.22" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Flow Gradient for Accent Lines -->
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8">
        <animate attributeName="offset" values="0;1;0" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.2" />
    </pattern>

    <!-- Filter for Pill Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.025em;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .floating-card-1 {
      animation: floatSlow 6s ease-in-out infinite alternate;
    }
    .floating-card-2 {
      animation: floatMid 7s ease-in-out infinite alternate;
    }
    .floating-card-3 {
      animation: floatReverse 8s ease-in-out infinite alternate;
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes floatMid {
      0% { transform: translateY(-8px); }
      100% { transform: translateY(6px); }
    }
    @keyframes floatReverse {
      0% { transform: translateY(6px); }
      100% { transform: translateY(-10px); }
    }
  </style>

  <!-- 1. BASE BACKGROUND -->
  <rect width="1280" height="440" fill="url(#bgGradient)" rx="16" />
  <rect width="1280" height="440" fill="url(#grid)" rx="16" />

  <!-- 2. AMBIENT GLOWS (BACKGROUND ONLY) -->
  <circle cx="240" cy="120" r="320" fill="url(#glowPurple)" />
  <circle cx="1040" cy="320" r="320" fill="url(#glowCyan)" />

  <!-- 3. DYNAMIC DATA FLOW LINES (BACKGROUND) -->
  <g opacity="0.35">
    <path d="M 0 160 Q 320 280 640 180 T 1280 220" fill="none" stroke="url(#flowLine)" stroke-width="2.5" />
    <path d="M 0 300 Q 400 120 800 290 T 1280 140" fill="none" stroke="url(#flowLine)" stroke-width="2" />
    <circle cx="480" cy="200" r="3" fill="#38bdf8">
      <animate attributeName="cx" values="200;1080;200" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="220;170;220" dur="12s" repeatCount="indefinite" />
    </circle>
    <circle cx="840" cy="260" r="3.5" fill="#a855f7">
      <animate attributeName="cx" values="1000;180;1000" dur="14s" repeatCount="indefinite" />
      <animate attributeName="cy" values="240;190;240" dur="14s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 4. FLOATING METRIC CARDS (PLACED ON SIDES / BACKGROUND LAYER) -->
  <!-- Left Side Floating Card: Metric Definition -->
  <g class="floating-card-1" transform="translate(60, 68)">
    <rect width="210" height="64" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="28" cy="32" r="8" fill="#10b981" />
    <text x="46" y="27" fill="#94a3b8" class="font-mono">metric: arr_usd</text>
    <text x="46" y="47" fill="#f8fafc" class="font-mono">$24,850,000</text>
  </g>

  <!-- Left Side Bottom Floating Card: Semantic Layer Node -->
  <g class="floating-card-2" transform="translate(48, 305)">
    <rect width="220" height="60" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" filter="url(#cardShadow)" />
    <text x="22" y="26" fill="#38bdf8" class="font-mono">SQL Mesh / Cube</text>
    <text x="22" y="46" fill="#94a3b8" class="font-mono">cache_hit: 98.4% • 14ms</text>
  </g>

  <!-- Right Side Floating Card: AI Agent Ready -->
  <g class="floating-card-3" transform="translate(980, 72)">
    <rect width="240" height="64" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="24" cy="32" r="7" fill="#a855f7" />
    <text x="40" y="27" fill="#c084fc" class="font-mono">AI Agent MCP API</text>
    <text x="40" y="47" fill="#e2e8f0" class="font-mono">zero-hallucination metrics</text>
  </g>

  <!-- Right Side Bottom Floating Card: Universal Consumer -->
  <g class="floating-card-1" transform="translate(990, 305)">
    <rect width="230" height="60" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
    <text x="20" y="26" fill="#fbbf24" class="font-mono">REST • GraphQL • SQL</text>
    <text x="20" y="46" fill="#94a3b8" class="font-mono">Any BI • Embedded • App</text>
  </g>

  <!-- 5. CENTER FOREGROUND (GUARANTEED ON TOP, NEVER COVERED) -->
  <g id="foreground">
    <!-- Top Pill Badge -->
    <g transform="translate(640, 95)">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#c7d2fe" font-size="13" class="font-mono">
        🏛️ SINGLE SOURCE OF TRUTH FOR METRICS
      </text>
    </g>

    <!-- Main Title -->
    <text x="640" y="185" text-anchor="middle" fill="url(#titleGradient)" font-size="44" class="font-title">
      Awesome Semantic Layer &amp; Headless BI
    </text>

    <!-- Subtitle -->
    <text x="640" y="232" text-anchor="middle" fill="#94a3b8" font-size="18.5" class="font-sub">
      Curated Ecosystem of Governed Metric Stores, Headless Serving APIs &amp; AI-Ready Semantics
    </text>

    <!-- Feature Pillars / Badges Row -->
    <g transform="translate(640, 290)">
      <!-- Feature 1 -->
      <g transform="translate(-320, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-size="12.5" class="font-mono">📐 Governed Metrics</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(-110, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-size="12.5" class="font-mono">⚡ Headless APIs</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(100, 0)">
        <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#a855f7" font-size="12.5" class="font-mono">🤖 AI Agent Ready</text>
      </g>

      <!-- Feature 4 -->
      <g transform="translate(305, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#10b981" font-size="12.5" class="font-mono">🌐 Zero Tool Lock-in</text>
      </g>
    </g>

    <!-- Version / Status Footer Line -->
    <text x="640" y="380" text-anchor="middle" fill="#64748b" font-size="13" class="font-mono">
      Curated by Community • Updated for 2026 Ecosystem • Open Source &amp; Enterprise
    </text>
  </g>
</svg>
